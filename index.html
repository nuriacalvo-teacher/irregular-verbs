        .exercise-card p { color: #555; line-height: 1.5; margin: 8px 0; }

        .score-percent { font-size: 1.1em; color: #2563eb; font-weight: bold; }

        .primary-button { background: #2563eb; color: white; min-width: 120px; }

        .secondary-button { background: #9ca3af; color: white; min-width: 120px; }
        .secondary-button:hover { background: #6b7280; }
        .hint-button { background: #f59e0b; color: white; min-width: 120px; }

        .exercise-form { background: #f9fafb; padding: 25px; border-radius: 12px; margin-bottom: 20px; border: 2px solid #e5e7eb; }

        .verb-field label { display: block; color: #1e3a8a; font-weight: bold; margin-bottom: 8px; }
        .feedback-section { padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .feedback-section.correct { background: #dcfce7; border: 2px solid #16a34a; color: #166534; }
        .feedback-section.incorrect { background: #fee2e2; border: 2px solid #dc2626; color: #991b1b; }
        .exercise-buttons { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; }
        .exercise-buttons button { flex: 1; min-width: 120px; }
        .hint-display { background: #fef3c7; border: 2px solid #f59e0b; padding: 15px; border-radius: 8px; margin-bottom: 15px; }

        .hint-item { margin: 8px 0; color: #92400e; }
        .theory-table { width: 100%; border-collapse: collapse; margin: 20px 0; }
        .theory-table th { background: #1e3a8a; color: white; padding: 15px; text-align: left; }
        .theory-table td { padding: 12px 15px; border-bottom: 1px solid #e5e7eb; color: #555; }
        .theory-table tr:hover { background: #f9fafb; }
        .theory-table tr:nth-child(even) { background: #f9fafb; }
        .page-footer { text-align: center; color: #9ca3af; font-size: 0.9em; padding: 20px; margin-top: 40px; }
        .leaderboard-container { max-height: 85vh; overflow-y: auto; }
        .theory-container { max-height: 85vh; overflow-y: auto; }
        .results-container { text-align: center; }
        .results-header { font-size: 3em; margin-bottom: 20px; }
        .results-excellent { color: #16a34a; }
        .results-encouraging { color: #f59e0b; }

            { texto_español: "Mordiste la manzana.", respuestas_validas: ["You bit the apple.", "You have bitten the apple."] },
            { texto_español: "La mano ha sangrado sobre el suelo.", respuestas_validas: ["The hand has bled on the floor.", "The hand has bled onto the floor.", "The hand bled onto the floor."] },
            { texto_español: "Sopló las velas en su cumpleaños número treinta.", respuestas_validas: ["He blew out the candles on his thirtieth birthday.", "She blew out the candles on her thirtieth birthday."] },
            { texto_español: "Construyeron la casa con materiales nuevos.", respuestas_validas: ["They built the house with new materials.", "They constructed the house with new materials.", "They have built the house with new materials."] },
            { texto_español: "El fuego se encendió en el campamento.", respuestas_validas: ["The fire lit at the camp.", "The fire started at the camp.", "The fire burned at the camp."] },
            { texto_español: "Atrapé al ladrón en la tienda de ropa.", respuestas_validas: ["I caught the thief in the clothes shop.", "I caught the robber in the clothes shop."] },
            { texto_español: "Ella ha pagado todos los gastos del viaje.", respuestas_validas: ["She has paid all the travel expenses.", "She has paid for all the travel expenses.", "She has paid all the trip expenses."] },
            { texto_español: "Negociaron un nuevo contrato favorable.", respuestas_validas: ["They negotiated a favorable new contract.", "They made a favorable new contract.", "They worked out a favorable new contract."] },
            { texto_español: "Excavó el pozo en el jardín.", respuestas_validas: ["He dug the well in the garden.", "She dug the well in the garden.", "He dug the hole in the garden."] },
            { texto_español: "Disfruté el concierto de jazz.", respuestas_validas: ["I enjoyed the jazz concert.", "I liked the jazz concert."] },
            { texto_español: "Ella ha burlado el sistema de seguridad.", respuestas_validas: ["She has eluded the security system.", "She has evaded the security system.", "She has bypassed the security system."] },
            { texto_español: "Alimenté al gato esta mañana.", respuestas_validas: ["I fed the cat this morning.", "I gave food to the cat this morning.", "I have fed the cat this morning."] },
            { texto_español: "Él se sintió bien después del viaje.", respuestas_validas: ["He felt well after the trip.", "She felt well after the trip.", "He felt good after the trip."] },
            { texto_español: "Luché contra mis miedos.", respuestas_validas: ["I fought against my fears.", "I struggled with my fears.", "I have fought my fears."] }
        ];

        class IrregularVerbsApp {
            constructor() {
                this.state = {
                    student: { firstName: '', lastName: '', course: '' },
                    currentScreen: 'login',
                    currentExercise: 1,
                    currentQuestion: 0,
                    showFeedback: false,
                    showHint: false,
                    isAuthenticated: false,
                    password: 'nuriaLEGEND',
                    startTime: null,
                    endTime: null,
                    leaderboardData: [],
                    scores: { ejercicio1: 0, ejercicio2: 0, ejercicio3: 0 }
                };
                this.init();
            }

            init() {
                this.shuffleExercises();
                this.render();
            }

            setState(newState) {
                this.state = { ...this.state, ...newState };
                this.render();
            }

            shuffleArray(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
                return array;
            }

            shuffleExercises() {
                this.ejercicio1 = this.shuffleArray([...ALL_IRREGULAR_VERBS]).slice(0, 50);
                this.ejercicio2 = this.shuffleArray([...FRASES_EJERCICIO_2]).slice(0, 50);
                this.ejercicio3 = this.shuffleArray([...FRASES_EJERCICIO_3]).slice(0, 20);
            }

            normalize(s) {
                return s.toLowerCase().trim().replace(/[.,!?;:"']/g, '');
            }

            render() {
                const app = document.getElementById('app');
                if (!this.state.isAuthenticated) {
                    app.innerHTML = this.renderAuthScreen();
                    this.attachAuthListeners();
                    return;
                }
                switch (this.state.currentScreen) {
                    case 'login': app.innerHTML = this.renderLogin(); this.attachLoginListeners(); break;
                    case 'menu': app.innerHTML = this.renderMenu(); this.attachMenuListeners(); break;
                    case 'theory': app.innerHTML = this.renderTheory(); this.attachTheoryListeners(); break;
                    case 'leaderboard': app.innerHTML = this.renderLeaderboard(); this.attachMenuListeners(); break;
                    case 'exercises': app.innerHTML = this.renderExercises(); this.attachExerciseListeners(); break;
                    case 'finalResults': app.innerHTML = this.renderFinalResults(); this.attachResultsListeners(); break;
                }
            }

            renderAuthScreen() {
                return `<div class="auth-container"><h2>🔐 Access Code</h2><input type="password" id="accessCode" placeholder="Enter code"><button class="primary-button" id="submitCode">Enter</button></div>`;
            }

            renderLogin() {
                return `<div class="login-container"><h1>🇪🇸 Irregular Verbs</h1><input type="text" id="firstName" placeholder="First Name"><input type="text" id="lastName" placeholder="Last Name"><input type="text" id="course" placeholder="Course"><button class="primary-button" id="startButton">Start</button></div>`;
            }

            renderMenu() {
                const total = this.state.scores.ejercicio1 + this.state.scores.ejercicio2 + this.state.scores.ejercicio3;
                const maxTotal = 150;
                const percentage = Math.round((total / maxTotal) * 100);
                return `
                    <div class="menu-container">
                        <h1>🇪🇸 Irregular Verbs</h1>
                        <div class="welcome-section">
                            <p class="welcome-name">Welcome, <strong>${this.state.student.firstName} ${this.state.student.lastName}</strong></p>
                            <p class="welcome-course">${this.state.student.course}</p>
                        </div>

                        <div class="exercises-section">
                            <div class="exercise-card">
                                <h2>🇪🇸 Ejercicio 1</h2>
                                <p><strong>Infinitive, Past, Participle</strong></p>
                                <p class="description">50 exercises. Fill in the three forms of irregular verbs.</p>
                                <div class="score-display">
                                    <span class="score-number">${this.state.scores.ejercicio1}/50</span>
                                    <span class="score-percent">${Math.round((this.state.scores.ejercicio1 / 50) * 100)}%</span>
                                </div>
                                <button class="exercise-button" data-exercise="1">Start</button>
                            </div>

                            <div class="exercise-card">
                                <h2>📖 Ejercicio 2</h2>
                                <p><strong>Fill in the gaps</strong></p>
                                <p class="description">50 exercises. Complete sentences with the correct verb form.</p>
                                <div class="score-display">
                                    <span class="score-number">${this.state.scores.ejercicio2}/50</span>
                                    <span class="score-percent">${Math.round((this.state.scores.ejercicio2 / 50) * 100)}%</span>
                                </div>
                                <button class="exercise-button" data-exercise="2">Start</button>
                            </div>

                            <div class="exercise-card">
                                <h2>🌍 Ejercicio 3</h2>
                                <p><strong>Translate to English</strong></p>
                                <p class="description">20 exercises. Translate Spanish sentences to English.</p>
                                <div class="score-display">
                                    <span class="score-number">${this.state.scores.ejercicio3}/20</span>
                                    <span class="score-percent">${Math.round((this.state.scores.ejercicio3 / 20) * 100)}%</span>
                                </div>
                                <button class="exercise-button" data-exercise="3">Start</button>
                            </div>
                        </div>

                        <div class="total-score">
                            <h3>📊 Total Score</h3>
                            <div class="score-display">
                                <span class="score-number">${total}/${maxTotal}</span>
                                <span class="score-percent">${percentage}%</span>
                            </div>
                        </div>

                        <div class="menu-buttons">
                            <button id="theoryButton" class="secondary-button">📖 Theory</button>
                            <button id="leaderboardButton" class="secondary-button">🏆 Leaderboard</button>
                        </div>
                    </div>
                `;
            }

            renderTheory() {
                let table = '<table class="theory-table"><thead><tr><th>Spanish</th><th>Infinitive</th><th>Past</th><th>Participle</th></tr></thead><tbody>';
                ALL_IRREGULAR_VERBS.forEach(v => { 
                    table += `<tr><td>${v.español}</td><td>${v.infinitivo}</td><td>${v.pasado}</td><td>${v.participio}</td></tr>`; 
                });
                table += '</tbody></table>';
                return `<div class="theory-container"><h1>📖 100 Irregular Verbs</h1><p style="text-align:center; margin-bottom: 20px;">Complete reference list</p>${table}<br><button class="primary-button" id="backButton">Back</button></div>`;
            }

            renderLeaderboard() {
                const lb = this.state.leaderboardData || [];
                let table = '<table class="theory-table"><thead><tr><th>Rank</th><th>Name</th><th>Score</th><th>Time</th></tr></thead><tbody>';
                if (lb.length === 0) {
                    table += '<tr><td colspan="4">No data yet</td></tr>';
                } else {
                    lb.forEach((entry, idx) => {
                        table += `<tr><td>${idx + 1}</td><td>${entry.firstName} ${entry.lastName}</td><td>${entry.score}/100</td><td>${entry.time}s</td></tr>`;
                    });
                }
                table += '</tbody></table>';
                return `<div class="leaderboard-container"><h1>🏆 Leaderboard</h1>${table}<br><button class="primary-button" id="backButton">Back</button></div>`;
            }

            renderFinalResults() {
                const total = this.state.scores.ejercicio1 + this.state.scores.ejercicio2 + this.state.scores.ejercicio3;
                const percentage = Math.round((total / 120) * 100);
                const timeTaken = Math.round((this.state.endTime - this.state.startTime) / 1000);
                const minutes = Math.floor(timeTaken / 60);
                const seconds = timeTaken % 60;
                const isExcellent = percentage >= 80;

                const header = isExcellent ? 
                    `<div class="results-header results-excellent">🎉 CONGRATULATIONS! 🎉</div>` :
                    `<div class="results-header results-encouraging">⭐ YOU HAVE WORKED VERY HARD! ⭐</div>`;

                const message = isExcellent ?
                    `<p class="results-message">Excellent work! You have mastered the irregular verbs! Your dedication and hard work have paid off. Keep it up!</p>` :
                    `<p class="results-message">Great effort! You're doing well. Keep practicing and review the ones you found challenging. You can do it!</p>`;

                return `
                    <div class="results-container">
                        ${header}
                        
                        <div class="results-data">
                            <div class="results-data-row">
                                <span class="results-label">Name:</span>
                                <span class="results-value">${this.state.student.firstName} ${this.state.student.lastName}</span>
                            </div>
                            <div class="results-data-row">
                                <span class="results-label">Course:</span>
                                <span class="results-value">${this.state.student.course}</span>
                            </div>
                            <div class="results-data-row">
                                <span class="results-label">Date:</span>
                                <span class="results-value">${new Date().toLocaleDateString()}</span>
                            </div>
                            <div class="results-data-row">
                                <span class="results-label">Time:</span>
                                <span class="results-value">${minutes}m ${seconds}s</span>
                            </div>
                        </div>

                        <div class="results-score-box">
                            ${percentage}/100
                        </div>

                        ${message}

                        <div class="results-buttons">
                            <button class="primary-button" id="backToMenuButton">Back to Menu</button>
                            <button class="secondary-button" id="newSessionButton">New Session</button>
                        </div>
                    </div>
                `;
            }

            renderExercises() {
                const data = this.state.currentExercise === 1 ? this.ejercicio1 : 
                             this.state.currentExercise === 2 ? this.ejercicio2 : this.ejercicio3;
                
                const q = data[this.state.currentQuestion];
                let form = '', max = 50;
                
                if (this.state.currentExercise === 3) max = 20;
                
                if (this.state.currentExercise === 1) {
                    form = `<div class="exercise-form">
                        <h3>Fill the three forms:</h3>
                        <div class="spanish-verb">${q.español}</div>
                        <div class="verb-fields">
                            <div class="verb-field"><label>Infinitive:</label><input type="text" id="infinitivo"></div>
                            <div class="verb-field"><label>Past:</label><input type="text" id="pasado"></div>
                            <div class="verb-field"><label>Participle:</label><input type="text" id="participio"></div>
                        </div>
                    </div>`;
                } else {
    const hintBtn = this.state.currentExercise === 3 ? `<button class="hint-button" id="hintButton">💡 Hint</button>` : '';
    const hintDisplay = this.state.showHint && this.state.currentExercise === 3 ? this.renderHintDisplay(q) : '';
    form = `<div class="exercise-form">
        <h3>${this.state.currentExercise === 2 ? 'Complete:' : 'Translate:'}</h3>
        <div class="spanish-sentence">${this.state.currentExercise === 2 ? q.frase_con_hueco : q.texto_español}</div>
        ${hintDisplay}
        <input type="text" id="answer">
    </div>${hintBtn}`;
}

                
                const feedback = this.state.showFeedback ? this.renderFeedback(q) : '';
                return `<div class="exercise-container">
                    <h1>Exercise ${this.state.currentExercise}</h1>
                    <div class="progress-bar"><div class="progress-fill" style="width: ${(this.state.currentQuestion / data.length) * 100}%"></div></div>
                    <p>${this.state.currentQuestion + 1}/${data.length}</p>
                    ${form}
                    ${feedback}
                    <div class="exercise-buttons">
                        ${!this.state.showFeedback ? `<button class="primary-button" id="checkButton">Check</button>` : `<button class="primary-button" id="nextButton">Next</button>`}
                        <button class="secondary-button" id="exitButton">Exit</button>
                    </div>
                </div>`;
            }
renderHintDisplay(q) {
    if (!q.hints) return '';
    let hint = '<div class="hint-display"><strong>💡 Hints:</strong><br>';
    if (q.hints.nouns && q.hints.nouns.length > 0) {
        hint += q.hints.nouns.map(n => `<div class="hint-item"><strong>${n[0]}</strong> = ${n[1]}</div>`).join('');
    }
    if (q.hints.adjectives && q.hints.adjectives.length > 0) {
        hint += q.hints.adjectives.map(a => `<div class="hint-item"><strong>${a[0]}</strong> = ${a[1]}</div>`).join('');
    }
    if (q.hints.adverbs && q.hints.adverbs.length > 0) {
        hint += q.hints.adverbs.map(a => `<div class="hint-item"><strong>${a[0]}</strong> = ${a[1]}</div>`).join('');
    }
    hint += '</div>';
    return hint;
}

            
renderFeedback(q) {
                const answers = this.state.currentExercise === 1 ? 
                    { infinitivo: document.getElementById('infinitivo')?.value || '', pasado: document.getElementById('pasado')?.value || '', participio: document.getElementById('participio')?.value || '' } : 
                    { answer: document.getElementById('answer')?.value || '' };
                
                let isCorrect = false, feedback = '';
                if (this.state.currentExercise === 1) {
                    isCorrect = this.normalize(answers.infinitivo) === this.normalize(q.infinitivo) && 
                               this.normalize(answers.pasado) === this.normalize(q.pasado) && 
                               this.normalize(answers.participio) === this.normalize(q.participio);
                    feedback = `<div class="feedback-section ${isCorrect ? 'correct' : 'incorrect'}">
                        <h3>${isCorrect ? '✓ Correct!' : '✗ Incorrect'}</h3>
                        <p><strong>Infinitive:</strong> ${q.infinitivo}</p>
                        <p><strong>Past:</strong> ${q.pasado}</p>
                        <p><strong>Participle:</strong> ${q.participio}</p>
                    </div>`;
                } else {
                    const valid = this.state.currentExercise === 2 ? [q.respuesta_correcta] : q.respuestas_validas;
                    isCorrect = valid.some(v => this.normalize(v) === this.normalize(answers.answer));
                    feedback = `<div class="feedback-section ${isCorrect ? 'correct' : 'incorrect'}">
                        <h3>${isCorrect ? '✓ Correct!' : '✗ Incorrect'}</h3>
                        <p><strong>Answers:</strong></p>
                        <ul>${valid.map(v => `<li>${v}</li>`).join('')}</ul>
                    </div>`;
                }
                if (isCorrect) {
                    if (this.state.currentExercise === 1) this.state.scores.ejercicio1++;
                    else if (this.state.currentExercise === 2) this.state.scores.ejercicio2++;
                    else this.state.scores.ejercicio3++;
                }
                return feedback;
            }

            saveScoreToSheets() {
                const total = this.state.scores.ejercicio1 + this.state.scores.ejercicio2 + this.state.scores.ejercicio3;
                const percentage = Math.round((total / 120) * 100);
                const timeTaken = Math.round((this.state.endTime - this.state.startTime) / 1000);
                const now = new Date().toLocaleDateString();

                fetch(GOOGLE_SHEETS_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'saveScore',
                        date: now,
                        firstName: this.state.student.firstName,
                        lastName: this.state.student.lastName,
                        course: this.state.student.course,
                        score: percentage,
                        time: timeTaken
                    })
                })
                .then(response => response.json())
                .then(data => console.log('Score saved'))
                .catch(error => console.error('Error:', error));
            }

            loadLeaderboard() {
                fetch(GOOGLE_SHEETS_URL + '?action=getLeaderboard')
                    .then(r => r.json())
                    .then(data => {
                        const sorted = (data || []).sort((a, b) => b.score - a.score).slice(0, 10);
                        this.setState({ leaderboardData: sorted, currentScreen: 'leaderboard' });
                    })
                    .catch(e => this.setState({ currentScreen: 'leaderboard' }));
            }

            attachAuthListeners() {
                document.getElementById('submitCode').addEventListener('click', () => {
                    if (document.getElementById('accessCode').value === this.state.password) {
                        this.state.isAuthenticated = true;
                        this.setState({ currentScreen: 'login' });
                    }
                });
            }

            attachLoginListeners() {
                document.getElementById('startButton').addEventListener('click', () => {
                    this.setState({ 
                        student: { 
                            firstName: document.getElementById('firstName').value, 
                            lastName: document.getElementById('lastName').value, 
                            course: document.getElementById('course').value 
                        }, 
                        currentScreen: 'menu',
                        startTime: Date.now()
                    });
                });
            }

            attachMenuListeners() {
                document.querySelectorAll('.exercise-button').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const exercise = parseInt(e.target.dataset.exercise);
                        this.setState({
                            currentScreen: 'exercises',
                            currentExercise: exercise,
                            currentQuestion: 0,
                            showFeedback: false,
                            showHint: false
                        });
                    });
                });

                document.getElementById('theoryButton')?.addEventListener('click', () => {
                    this.setState({ currentScreen: 'theory' });
                });

                document.getElementById('leaderboardButton')?.addEventListener('click', () => {
                    this.loadLeaderboard();
                });

                document.getElementById('backButton')?.addEventListener('click', () => {
                    this.setState({ currentScreen: 'menu' });
                });
            }

            attachTheoryListeners() {
                document.getElementById('backButton')?.addEventListener('click', () => {
                    this.setState({ currentScreen: 'menu' });
                });
            }

            attachResultsListeners() {
                document.getElementById('backToMenuButton')?.addEventListener('click', () => {
                    this.setState({ currentScreen: 'menu' });
                });

                document.getElementById('newSessionButton')?.addEventListener('click', () => {
                    location.reload();
                });
            }

            attachExerciseListeners() {
                document.getElementById('checkButton')?.addEventListener('click', () => {
                    this.setState({ showFeedback: true });
                });

                document.getElementById('nextButton')?.addEventListener('click', () => {
                    const data = this.state.currentExercise === 1 ? this.ejercicio1 : 
                                 this.state.currentExercise === 2 ? this.ejercicio2 : this.ejercicio3;
                    
                    const nextQuestion = this.state.currentQuestion + 1;
                    
                    if (nextQuestion >= data.length) {
                        if (this.state.currentExercise === 3) {
                            this.state.endTime = Date.now();
                            this.saveScoreToSheets();
                            this.setState({ currentScreen: 'finalResults' });
                        } else {
                            this.setState({
                                currentScreen: 'menu',
                                currentQuestion: 0,
                                showFeedback: false,
                                showHint: false
                            });
                        }
                    } else {
                        this.setState({
                            currentQuestion: nextQuestion,
                            showFeedback: false,
                            showHint: false
                        });
                    }
                });

                document.getElementById('exitButton')?.addEventListener('click', () => {
                    this.setState({ 
                        currentScreen: 'menu', 
                        currentQuestion: 0, 
                        showFeedback: false 
                    });
                });
		document.getElementById('hintButton')?.addEventListener('click', () => {
    			this.setState({ showHint: !this.state.showHint });
		});
            }
        

        new IrregularVerbsApp();
    </script>
</body>
</html>
